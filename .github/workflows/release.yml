name: Release

on:
  push:
    tags:
      - '[0-9]*'
    branches:
      - main
      - 'feature/windows-host'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd AndroidClient
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cp AndroidClient/app/build/outputs/apk/release/app-release.apk "SideScreen-${VERSION}-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "*.apk"

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.7.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Configure CMake
        working-directory: WindowsHost
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        working-directory: WindowsHost
        run: cmake --build build --config Release

      - name: Prepare dist with windeployqt
        working-directory: WindowsHost
        shell: cmd
        run: |
          mkdir installer\dist
          copy build\Release\SideScreen.exe installer\dist\
          windeployqt --release --no-translations --no-opengl-sw installer\dist\SideScreen.exe

      - name: Build installer with Inno Setup
        working-directory: WindowsHost/installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" sidescreen.iss

      - name: Rename APK
        run: |
          cp WindowsHost/installer/output/SideScreen-Setup.exe "SideScreen-Setup.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Exe
          path: SideScreen-Setup.exe

  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --oneline -10 --format="- %s")
          else
            NOTES=$(git log --oneline "$PREV_TAG"..HEAD --format="- %s" | grep -v "^- chore:" | head -3)
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Side Screen v${{ steps.version.outputs.version }}"
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.notes }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows | `SideScreen-Setup.exe` |
            | Android | `SideScreen-${{ steps.version.outputs.version }}-android.apk` |

           
          files: |
            artifacts/Windows-Exe/*.exe
            artifacts/android-apk/*.apk
          draft: false
          prerelease: false
